name: core-ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U core"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
        if: hashFiles('.env') == ''
      - run: pnpm run db:setup
      - run: pnpm run typecheck
      - run: pnpm run test run
      - run: pnpm --dir web run build
      - run: pnpm run build
      - run: pnpm --dir infra run check
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.artisan.st
    concurrency:
      group: production
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U core"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AST_CORE_ORIGIN: https://api.artisan.st
      AST_RELAY_ORIGIN: https://relay.editor.artisan.st
      AST_AUTH_ORIGIN: https://auth.artisan.st
      AST_DASHBOARD_ORIGIN: https://dashboard.artisan.st
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm run db:setup
      - run: pnpm --dir web run build
      - run: pnpm run build
      - name: Apply production migrations
        run: pnpm run db:setup
        env:
          DATABASE_URL: ${{ secrets.AST_CORE_DATABASE_URL }}
      - name: Deploy tested commit
        run: pnpm --dir infra run deploy --stage prod --yes --no-input
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AST_CORE_DATABASE_URL: ${{ secrets.AST_CORE_DATABASE_URL }}
          CORE_MASTER_KEY: ${{ secrets.CORE_MASTER_KEY }}
          CORE_ADMIN_TOKEN: ${{ secrets.CORE_ADMIN_TOKEN }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ vars.AST_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.AST_GITHUB_CLIENT_SECRET }}
